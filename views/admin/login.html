<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication | St. Martin's High School</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: var(--navy-midnight); display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="background: var(--navy-deep); padding: 3rem; border: 1px solid var(--gold); width: 100%; max-width: 420px; color: var(--ivory);">
        <span class="eyebrow" style="text-align: center;">Secure Gateway</span>
        <h2 style="font-size: 2rem; color: var(--white); text-align: center; margin-bottom: 2rem;">Admin Portal</h2>
        
        <form action="/api/admin/login" method="POST" style="display: grid; gap: 1.5rem;">
            <div>
                <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.5rem; color: var(--gold);">Username</label>
                <input type="text" name="username" required style="width: 100%; padding: 0.75rem; background: var(--navy-midnight); border: 1px solid rgba(197,164,90,0.3); color: var(--white);">
            </div>
            <div>
                <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.5rem; color: var(--gold);">Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.75rem; background: var(--navy-midnight); border: 1px solid rgba(197,164,90,0.3); color: var(--white);">
            </div>
            <button type="submit" class="btn-gold" style="width: 100%; text-align: center; cursor: pointer; margin-top: 1rem;">Authenticate</button>
        </form>
    </div>
</body>
</html>
