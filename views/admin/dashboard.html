<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | St. Martin's High School</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: var(--ivory);">
    <header style="background: var(--navy-midnight); color: var(--white); padding: 1.25rem 5%; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-family: var(--font-display); color: var(--white); font-size: 1.25rem;">St. Martin's Management Console</h2>
        <a href="/admin/login" style="color: var(--gold); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Sign Out</a>
    </header>
    <main style="padding: 4rem 5%; max-width: 1200px; margin: 0 auto;">
        <span class="eyebrow">Control Center</span>
        <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">Institutional Records & Enquiries</h1>
        <div class="gold-rule"></div>
        <div style="background: var(--white); padding: 2rem; border-top: 3px solid var(--gold); margin-top: 2rem;">
            <h3 style="font-size: 1.5rem; margin-bottom: 1rem;">Recent Admission Enquiries</h3>
            <p style="font-weight: 300; color: var(--charcoal);">Live database records populate dynamically from the MySQL `admissions_enquiries` relation.</p>
        </div>
    </main>
</body>
</html>
